name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un nuevo push cancela el deploy anterior en curso (evita el error
# "in progress deployment" cuando llegan pushes cada 15 min).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Si el deploy falla por un problema de la API de GitHub, lo relanza UNA vez a los 60 s
  # (solo desde un push; el relanzamiento es workflow_dispatch, asi que no se encadena).
  retry:
    needs: deploy
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relanzar deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
